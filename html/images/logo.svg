<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="40" height="40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Símbolo de código/desarrollo minimalista -->
  <!-- Corchete izquierdo </ -->
  <path d="M 35 40 L 25 60 L 35 80" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Símbolo en el centro (paleta de diseño) -->
  <circle cx="60" cy="60" r="12" fill="none" stroke="url(#logoGradient)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="4" fill="url(#logoGradient)"/>
  
  <!-- Corchete derecho /> -->
  <path d="M 85 40 L 95 60 L 85 80" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>