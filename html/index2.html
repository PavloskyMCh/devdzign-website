<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devdzign.online - Variante 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #111827 0%, #1f2937 50%, #312e81 100%);
            color: #f9fafb;
            text-align: center;
            padding: 1rem;
        }

        .card {
            background: rgba(17, 24, 39, 0.9);
            padding: 2.5rem 2rem;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(244, 114, 182, 0.35);
            backdrop-filter: blur(10px);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(236, 72, 153, 0.12);
            color: #f9a8d4;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(236, 72, 153, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #f472b6;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.7);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(244, 114, 182, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(244, 114, 182, 0);
            }
        }

        h1 {
            color: #f472b6;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        p {
            color: #d1d5db;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }

        .btn {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.6rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(236, 72, 153, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge">
            <span class="status-dot"></span>
            Diseño Alternativo
        </div>
        <h1>¡Otra versión visual!</h1>
        <p>Este archivo ofrece una combinación de colores distinta con un estilo más moderno y vibrante para <strong>devdzign.online</strong>.</p>
        <button class="btn" id="actionBtn">Ver URL del sitio</button>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');

        btn.addEventListener('click', () => {
            navigator.clipboard.writeText('https://devdzign.online');
            const originalText = btn.textContent;

            btn.textContent = '¡URL copiada!';
            btn.style.background = 'linear-gradient(135deg, #10b981 0%, #34d399 100%)';

            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 2000);
        });
    </script>
</body>
</html>
